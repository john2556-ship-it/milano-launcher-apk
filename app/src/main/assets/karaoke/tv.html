<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="/qrcode.js"></script>
<title>Karaoke · TV</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#eef1f8;overflow:hidden;
            font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
  #player{position:fixed;inset:0;width:100vw;height:100vh;border:0}
  .hide{display:none!important}

  /* ===== Màn hình chờ / chào đón MILANO KARAOKE ===== */
  #idle{position:fixed;inset:0;z-index:2;overflow:hidden;background:#05030f}
  #idle .lights{position:absolute;inset:-25%;filter:blur(40px);opacity:.9;
    background:radial-gradient(30% 30% at 25% 30%,#ff2d87aa,transparent 70%),
               radial-gradient(30% 30% at 75% 25%,#7c5cffaa,transparent 70%),
               radial-gradient(35% 35% at 50% 85%,#00d4ffaa,transparent 70%);
    animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Đèn sân khấu quét qua lại */
  .beam{position:absolute;top:-10vh;width:16vw;height:130vh;transform-origin:50% 0;mix-blend-mode:screen;
        background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 85%);
        clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);opacity:.35}
  .beam.b1{left:12vw;animation:sweepL 5s ease-in-out infinite alternate;background:linear-gradient(180deg,#ff5d8fcc,transparent 85%)}
  .beam.b2{right:12vw;animation:sweepR 6s ease-in-out infinite alternate;background:linear-gradient(180deg,#7cd8ffcc,transparent 85%)}
  .beam.b3{left:42vw;animation:sweepL 7s ease-in-out infinite alternate-reverse;background:linear-gradient(180deg,#ffd36ecc,transparent 85%)}
  @keyframes sweepL{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
  @keyframes sweepR{from{transform:rotate(28deg)}to{transform:rotate(-22deg)}}

  #idle .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
                padding-bottom:10vh;text-align:center}
  #idle .hello{font-size:2vw;letter-spacing:.6vw;color:#ffe9b0;text-transform:uppercase;opacity:.9}
  #idle .t1{font-size:10vw;font-weight:900;line-height:.95;letter-spacing:.4vw;margin-top:1vw;
            filter:drop-shadow(0 .4vw 1.2vw rgba(255,180,60,.45))}
  #idle .t1 span{display:inline-block;color:#ffd36e;
            background:linear-gradient(180deg,#fff6d8 0%,#ffd36e 45%,#e08a1e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #idle .t2{font-size:7.5vw;font-weight:900;letter-spacing:1.2vw;color:#fff;margin-top:.5vw;
            text-shadow:0 0 .6vw #fff,0 0 1.6vw #ff4fa0,0 0 3.5vw #ff4fa0,0 0 6vw #ff2d87;
            animation:neon 3s infinite}
  @keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
  #idle .sub{font-size:2vw;color:#d6dcf0;margin-top:2vw}

  /* Cột nhạc nhảy ở dưới */
  #eq{position:absolute;left:0;right:0;bottom:0;height:16vh;display:flex;align-items:flex-end;gap:.5vw;padding:0 2vw;opacity:.85}
  #eq i{flex:1;height:100%;border-radius:.5vw .5vw 0 0;transform-origin:bottom;
        background:linear-gradient(0deg,#7c5cff,#ff4fa0 60%,#ffd36e);animation:eq 1s ease-in-out infinite alternate}
  @keyframes eq{from{transform:scaleY(.08)}to{transform:scaleY(1)}}

  /* Nốt nhạc bay lên */
  .note{position:absolute;bottom:-6vh;font-size:3vw;color:#fff;opacity:0;animation:rise linear infinite;text-shadow:0 0 1vw #ff4fa0}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}

  /* Mã QR ở góc */
  #qrCard{position:absolute;right:2.5vw;bottom:3vw;display:flex;align-items:center;gap:1.4vw;z-index:2;
          background:rgba(10,8,30,.7);border:1px solid rgba(255,255,255,.18);border-radius:1.6vw;padding:1vw 1.2vw 1vw 1.6vw;
          backdrop-filter:blur(10px);box-shadow:0 1vw 4vw rgba(0,0,0,.5)}
  #qrCard .txt{font-size:1.5vw;font-weight:800;line-height:1.3;width:15vw}
  #qrCard .txt small{display:block;font-weight:400;color:#9aa3b8;font-size:1vw;margin-top:.4vw;word-break:break-all}
  #qrCard .qr{background:#fff;padding:.6vw;border-radius:1vw;width:13vw;height:13vw;position:relative}
  #qrCard .qr::after{content:"";position:absolute;inset:-.5vw;border-radius:1.4vw;border:.25vw solid #ff4fa0;animation:ring 2s ease-out infinite}
  @keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.12)}}

  /* ---- Hiệu ứng mở màn (chạy 1 lần khi vào) ---- */
  #idle.enter .lights{animation:fadeIn 1.2s ease both, spin 18s linear infinite}
  #idle.enter .beam{animation-delay:0s}
  #idle.enter .hello{animation:up .8s .3s ease both}
  #idle.enter .t1 span{animation:drop .7s cubic-bezier(.2,1.6,.4,1) both}
  #idle.enter .t2{animation:flickOn 1.2s 1.6s both, neon 3s 2.8s infinite}
  #idle.enter .sub{animation:up .8s 2.6s ease both}
  #idle.enter #eq{animation:fadeIn 1s 1.2s both}
  #idle.enter #qrCard{animation:slideIn .9s 3s cubic-bezier(.2,1.3,.4,1) both}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
  #idle.enter #flash{animation:flash .9s 1.55s ease-out both}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes up{from{opacity:0;transform:translateY(3vw)}}
  @keyframes drop{from{opacity:0;transform:translateY(-60vh) scale(1.6)}}
  @keyframes flickOn{0%{opacity:0}10%{opacity:1}15%{opacity:.1}25%{opacity:1}30%{opacity:.2}45%,100%{opacity:1}}
  @keyframes flash{0%{opacity:0}6%{opacity:.85}100%{opacity:0}}
  @keyframes slideIn{from{opacity:0;transform:translateX(30vw)}}
  .qr svg{width:100%;height:100%;display:block}

  /* Góc QR + bài tiếp theo */
  #corner{position:fixed;right:1.5vw;top:1.5vw;z-index:3;display:flex;gap:1vw;align-items:flex-start;
          transition:opacity .4s}
  /* Mã QR khi đang hát: giữa cạnh phải (tránh logo kênh ở góc trên và lời bài hát ở dưới), luôn rõ nét */
  #qrFloat{position:fixed;right:1.2vw;top:50%;transform:translateY(-50%);z-index:3;text-align:center;
           background:rgba(10,14,30,.8);border:1px solid rgba(255,255,255,.18);border-radius:1vw;padding:.5vw .5vw .6vw}
  #qrFloat .qr{background:#fff;padding:.35vw;border-radius:.6vw;width:6.5vw;height:6.5vw}
  #qrFloat .cap{font-size:.85vw;line-height:1.25;color:#d6dcf0;margin-top:.4vw;font-weight:700}
  #nextBox{background:rgba(10,14,30,.78);border:1px solid rgba(255,255,255,.15);border-radius:1vw;
           padding:.8vw 1.2vw;max-width:28vw;font-size:1.15vw;backdrop-filter:blur(8px)}
  #nextBox b{color:#ffd36e}
  #nextBox .row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.2vw}

  /* Banner tên bài lúc bắt đầu */
  /* Dải chữ chạy trên cùng: ai đang hát bài gì (hiện suốt bài) */
  #ticker{position:fixed;left:1.5vw;right:31vw;top:1.5vw;z-index:3;height:3.6vw;overflow:hidden;border-radius:99px;
          background:rgba(10,14,30,.72);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);
          -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%)}
  #ticker .run{display:inline-flex;white-space:nowrap;height:100%;align-items:center;animation:tick linear infinite}
  #ticker .run span{padding-right:6vw;font-size:1.7vw;font-weight:800;color:#fff}
  #ticker .run b{color:#ffd36e}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  #banner{position:fixed;left:2vw;bottom:3vw;z-index:3;background:rgba(10,14,30,.82);border-left:.5vw solid #ff5d8f;
          padding:1.2vw 2vw;border-radius:1vw;max-width:70vw;transition:opacity .6s, transform .6s}
  #banner .t{font-size:2.2vw;font-weight:800}
  #banner .s{font-size:1.5vw;color:#ffd36e;margin-top:.3vw}
  #banner.out{opacity:0;transform:translateY(2vw)}

  #toast{position:fixed;left:50%;top:2vw;transform:translateX(-50%);z-index:6;background:rgba(20,26,60,.92);
         border:1px solid rgba(255,255,255,.2);padding:1vw 2vw;border-radius:1.2vw;font-size:1.5vw;
         transition:opacity .4s;opacity:0;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1}

  @font-face{font-family:'MKDisplay';font-weight:900;font-display:swap;src:url(/be-vietnam-pro-vietnamese-900-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
  @font-face{font-family:'MKDisplay';font-weight:900;font-display:swap;src:url(/be-vietnam-pro-latin-ext-900-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'MKDisplay';font-weight:900;font-display:swap;src:url(/be-vietnam-pro-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:'MKScript';font-weight:700;font-display:swap;src:url(/dancing-script-vietnamese-700-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
  @font-face{font-family:'MKScript';font-weight:700;font-display:swap;src:url(/dancing-script-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'MKScript';font-weight:700;font-display:swap;src:url(/dancing-script-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  /* Video chào đón */
  #introVid{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;background:#000;z-index:8;transition:opacity .6s}
  #introVid.fade{opacity:0}
  #introVid.kb{animation:kenburns 12s ease-out both}          /* video nền zoom chậm */
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.16)}}   /* zoom in: video nền phóng to dần */

  /* ===== Chữ đặt lên video intro: hiệu ứng zoom in ===== */
  #introText{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
             text-align:center;pointer-events:none;transition:opacity .6s;padding:0 4vw;
             background:radial-gradient(60% 50% at 50% 50%,rgba(0,0,0,.35),transparent 75%)}
  #introText.fade{opacity:0}
  #introText .l{opacity:0;will-change:transform,opacity,filter}
  /* Kiểu chữ mặc định giống video mẫu: vàng kim nổi, chữ cuối xanh ngọc, dòng 3 viết tay vàng */
  #introText .l1,#introText .l2{font-family:'MKDisplay',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.15vw;line-height:1.3;
       filter:drop-shadow(0 .16vw 0 #5a3405) drop-shadow(0 .35vw .25vw rgba(40,18,0,.85)) drop-shadow(0 0 1.6vw rgba(255,200,90,.35))}
  #introText .l2{margin-top:.2vw}
  #introText .g,#introText .t{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #introText .g{color:#f2c76b;background-image:linear-gradient(180deg,#fff7d6 0%,#ffe39a 28%,#f0b955 52%,#b9741f 78%,#f7d98c 100%)}
  #introText .t{color:#5fd6e0;background-image:linear-gradient(180deg,#e9fdff 0%,#9eeef5 30%,#3cc3d3 58%,#16798c 82%,#8ce6ef 100%)}
  #introText .l3{font-family:'MKScript',cursive;font-weight:700;margin-top:.6vw;position:relative;
       filter:drop-shadow(0 .12vw 0 #5a3405) drop-shadow(0 0 1.2vw rgba(255,215,130,.6))}
  #introText .l3 .g{background-image:linear-gradient(180deg,#fffbe8 0%,#ffe7a8 40%,#e9b45a 75%,#fff1c4 100%)}
  /* Dải sáng uốn lượn quanh dòng 3 */
  #ribbons{position:absolute;left:50%;width:78vw;height:22vw;transform:translateX(-50%);pointer-events:none;opacity:0}
  #ribbons path{fill:none;stroke-linecap:round;stroke-dasharray:1600;stroke-dashoffset:1600}
  #introText.go #ribbons{animation:ribIn .4s 2.4s both}
  #introText.go #ribbons path{animation:draw 1.8s cubic-bezier(.3,.6,.2,1) both}
  #introText.go #ribbons path:nth-child(1){animation-delay:2.4s}
  #introText.go #ribbons path:nth-child(2){animation-delay:2.6s}
  #introText.go #ribbons path:nth-child(3){animation-delay:2.8s}
  @keyframes ribIn{to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  /* Nốt nhạc + lấp lánh quanh chữ */
  #introText .fx{position:absolute;inset:0;pointer-events:none}
  #introText .nt{position:absolute;color:#ffd77a;opacity:0;text-shadow:0 0 .8vw rgba(255,200,90,.9)}
  #introText.go .nt{animation:ntIn 1s both, ntFloat 3s ease-in-out infinite alternate}
  @keyframes ntIn{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:.95;transform:scale(1)}}
  @keyframes ntFloat{from{translate:0 0}to{translate:0 -1.2vw}}
  #introText .sp{position:absolute;width:.5vw;height:.5vw;border-radius:50%;background:#fff;opacity:0;
       box-shadow:0 0 .6vw .2vw rgba(255,230,160,.9)}
  #introText.go .sp{animation:twinkle 1.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  #introText.go .l{animation:zoomIn 1.3s cubic-bezier(.16,1,.3,1) both, breathe 6s ease-in-out 1.3s infinite alternate}
  #introText.go .l1{animation-delay:.5s, 1.8s}
  #introText.go .l2{animation-delay:1.4s, 2.7s}
  #introText.go .l3{animation-delay:2.3s, 3.6s}
  /* Zoom in: chữ hiện ra nhỏ rồi to dần lên đúng cỡ, sau đó tiếp tục tiến lại gần thật chậm */
  @keyframes zoomIn{0%{opacity:0;transform:scale(.15);filter:blur(1vw)}45%{opacity:1}100%{opacity:1;transform:scale(1);filter:blur(0)}}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.06)}}
  #introText .flare{position:absolute;width:60vw;height:.35vw;left:20vw;top:50%;opacity:0;
       background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(.15vw)}
  #introText.go .flare{animation:flare 1.1s .45s ease-out both}
  @keyframes flare{0%{opacity:0;transform:scaleX(.1)}30%{opacity:1}100%{opacity:0;transform:scaleX(1.6)}}
  /* Màn bắt đầu (cần 1 lần bấm OK để TV cho phép phát tiếng) */
  #start{position:fixed;inset:0;z-index:9;background:rgba(5,8,20,.92);display:flex;flex-direction:column;
         align-items:center;justify-content:center;font-size:2.4vw}
  #start button{font-size:2.4vw;padding:1.2vw 4vw;border-radius:99px;border:none;margin-top:2vw;color:#fff;
                background:linear-gradient(135deg,#ff5d8f,#7c5cff);font-weight:800}
  #start button:focus{outline:.3vw solid #fff;outline-offset:.4vw}

  /* Tìm trên TV */
  #tvs{position:fixed;inset:0;z-index:7;background:rgba(5,8,20,.95);padding:3vw 4vw}
  #tvs h2{margin:0 0 1.5vw;font-size:2.4vw}
  #tvs h2 small{color:#9aa3b8;font-weight:400;font-size:1.4vw;margin-left:1vw}
  #tvsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw;max-height:80vh;overflow:hidden}
  .res{border-radius:1vw;overflow:hidden;background:rgba(255,255,255,.06);border:.25vw solid transparent;transition:transform .15s}
  .res img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .res .t{padding:.7vw .9vw;font-size:1.15vw;line-height:1.3;height:4.2vw;overflow:hidden}
  .res .d{padding:0 .9vw .7vw;font-size:1vw;color:#9aa3b8}
  .res.focus{border-color:#ffd36e;transform:scale(1.04);background:rgba(255,255,255,.12)}
  .res.added{border-color:#3ddc97}
</style>
</head>
<body>

<div id="player"></div>

<div id="idle">
  <div class="lights"></div>
  <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
  <div id="notes"></div>
  <div id="eq"></div>
  <div class="center">
    <div class="hello">🎤 Chào mừng đến với</div>
    <div class="t1" id="t1"></div>
    <div class="t2" id="t2"></div>
    <div class="sub">Quét mã QR bằng điện thoại để chọn bài</div>
  </div>
  <div id="qrCard">
    <div class="txt">📱 Quét để chọn bài<small id="idleUrl"></small></div>
    <div class="qr" id="qrBig"></div>
  </div>
  <div id="flash"></div>
</div>

<div id="corner" class="hide">
  <div id="nextBox"></div>
</div>
<div id="qrFloat" class="hide"><div class="qr" id="qrSmall"></div><div class="cap">Quét để<br>chọn bài</div></div>

<div id="ticker" class="hide"><div class="run" id="tickRun"></div></div>
<div id="banner" class="out"><div class="t" id="bTitle"></div><div class="s" id="bSinger"></div></div>
<div id="toast"></div>

<div id="tvs" class="hide">
  <h2>Kết quả: <span id="tvsQ"></span><small>◀ ▶ ▲ ▼ chọn · OK thêm bài · Back để đóng</small></h2>
  <div id="tvsGrid"></div>
</div>

<video id="introVid" class="hide" src="/intro.mp4" preload="auto" playsinline></video>
<div id="introText" class="hide">
  <div class="fx" id="itFx"></div>
  <div class="flare"></div>
  <div class="l l1" id="it1"></div>
  <div class="l l2" id="it2"></div>
  <div class="l l3" id="it3wrap" style="position:relative">
    <svg id="ribbons" viewBox="0 0 1000 280" preserveAspectRatio="none">
      <defs>
        <linearGradient id="rg1" x1="0" x2="1"><stop offset="0" stop-color="#ff6fb5" stop-opacity="0"/><stop offset=".3" stop-color="#ff6fb5"/><stop offset=".7" stop-color="#c77dff"/><stop offset="1" stop-color="#c77dff" stop-opacity="0"/></linearGradient>
        <linearGradient id="rg2" x1="0" x2="1"><stop offset="0" stop-color="#5fe3f0" stop-opacity="0"/><stop offset=".4" stop-color="#5fe3f0"/><stop offset="1" stop-color="#9ef7ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="rg3" x1="0" x2="1"><stop offset="0" stop-color="#ffd77a" stop-opacity="0"/><stop offset=".5" stop-color="#fff1c4"/><stop offset="1" stop-color="#ffd77a" stop-opacity="0"/></linearGradient>
        <filter id="rglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path d="M30 200 C 220 300, 640 290, 900 170 S 990 60, 760 70" stroke="url(#rg1)" stroke-width="5" filter="url(#rglow)"/>
      <path d="M60 220 C 300 310, 700 300, 940 150 S 960 40, 700 60" stroke="url(#rg2)" stroke-width="4" filter="url(#rglow)"/>
      <path d="M90 180 C 320 270, 680 260, 920 140" stroke="url(#rg3)" stroke-width="3" filter="url(#rglow)"/>
    </svg>
    <span id="it3"></span>
  </div>
</div>
<div id="start">
  <div>🎤 Karaoke đã sẵn sàng</div>
  <button id="startBtn">Bấm OK để bắt đầu</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = null, player = null, ytReady = false, started = false, loadedId = null;

// Mã QR cho điện thoại (có token), vẽ ngay trên TV
function drawQr(url) {
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const svg = q.createSvgTag(4, 0);
  $('qrBig').innerHTML = svg; $('qrSmall').innerHTML = svg;
}
function loadInfo() {
  fetch('/api/info').then(r => r.json()).then(i => {
    $('idleUrl').textContent = i.remoteUrl.replace(/\?t=.*/, '');
    drawQr(i.remoteUrl);
  }).catch(() => setTimeout(loadInfo, 3000));
}
loadInfo();
setInterval(loadInfo, 60 * 1000);   // đổi Wi-Fi / IP thì mã QR tự cập nhật (mỗi phút)

// ---------- Bắt đầu (1 lần bấm cho phép tự phát có tiếng) ----------
$('startBtn').focus();
// ---------- Màn chào đón MILANO KARAOKE ----------
// Tên trên màn chào đón (đổi trong ⚙️ Cài đặt trên điện thoại)
let brandKey = '';
function setBrand(b1, b2) {
  const key = b1 + '|' + b2;
  if (key === brandKey) return;
  brandKey = key;
  const chars = [...b1];
  $('t1').innerHTML = chars.map((ch, i) => `<span style="animation-delay:${(.15 + i * Math.min(.12, 1.2 / Math.max(chars.length, 1))).toFixed(2)}s">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('');
  $('t2').textContent = b2;
  // Tên dài thì chữ nhỏ lại cho vừa màn hình
  $('t1').style.fontSize = Math.min(10, 135 / Math.max(chars.length, 1)) + 'vw';
  $('t2').style.fontSize = Math.min(7.5, 80 / Math.max([...b2].length, 1)) + 'vw';
  $('t2').style.display = b2 ? '' : 'none';
}
setBrand('MILANO', 'KARAOKE');
(function buildStage() {
  $('eq').innerHTML = Array.from({ length: 36 }, () =>
    `<i style="animation-duration:${(0.35 + Math.random() * 0.6).toFixed(2)}s;animation-delay:-${Math.random().toFixed(2)}s"></i>`).join('');
  const sym = ['♪', '♫', '♬', '♩', '🎵', '🎤'];
  $('notes').innerHTML = Array.from({ length: 14 }, (_, i) =>
    `<span class="note" style="left:${(i * 7 + Math.random() * 5).toFixed(1)}vw;animation-duration:${(7 + Math.random() * 6).toFixed(1)}s;animation-delay:-${(Math.random() * 10).toFixed(1)}s;font-size:${(2 + Math.random() * 2).toFixed(1)}vw">${sym[i % sym.length]}</span>`).join('');
})();

// Nhạc hiệu ngắn (tự tổng hợp, không cần file nhạc)
function jingle() {
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    const play = () => { if (!A._played) { A._played = true; jingleOn(A, A.currentTime + 0.05); } };
    // Có máy TV để âm thanh ở trạng thái tạm dừng lúc đầu: bật lại rồi mới phát
    if (A.state === 'suspended') {
      A.resume().then(play).catch(() => {});
      document.addEventListener('keydown', () => A.resume().then(play), { once: true });
    } else play();
  } catch (_) { }
}
function jingleOn(A, t0) {
  {
    const out = A.createGain(); out.gain.value = 0.22; out.connect(A.destination);
    const tone = (f, t, d, type = 'triangle', v = 1) => {
      const o = A.createOscillator(), g = A.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.05);
    };
    const kick = t => {
      const o = A.createOscillator(), g = A.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.25);
      g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.35);
    };
    const crash = t => {
      const b = A.createBuffer(1, A.sampleRate * 1.2, A.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      const n = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain();
      f.type = 'highpass'; f.frequency.value = 5000; g.gain.value = 0.5;
      n.buffer = b; n.connect(f); f.connect(g); g.connect(out); n.start(t);
    };
    // Lên dần từng chữ MILANO, rồi bùng lên ở chữ KARAOKE
    [523, 587, 659, 698, 784, 880].forEach((f, i) => tone(f, t0 + 0.15 + i * 0.12, 0.25, 'square', 0.35));
    [0, 0.5, 1.0].forEach(d => kick(t0 + d));
    const hit = t0 + 1.6;
    kick(hit); crash(hit);
    [523, 659, 784, 1047].forEach(f => tone(f, hit, 1.6, 'sawtooth', 0.28));
    [262, 392].forEach(f => tone(f, hit, 1.8, 'triangle', 0.6));
    tone(1319, hit + 0.45, 0.6, 'square', 0.25); tone(1568, hit + 0.7, 0.9, 'square', 0.25);
  }
}

// Chế độ chào đón khi mới mở app Milano Launcher: chạy xong thì vào launcher
const INTRO_ONLY = new URLSearchParams(location.search).get('intro') === '1';
function toLauncher() {
  $('idle').style.transition = 'opacity .6s'; $('idle').style.opacity = 0;
  $('introVid').classList.add('fade');
  setTimeout(() => { try { MilanoApp.reload(); } catch (_) { history.back(); } }, 600);
}
if (INTRO_ONLY) {
  document.querySelector('#idle .sub').style.display = 'none';   // chưa vào karaoke: không cần mã QR
  $('qrCard').style.display = 'none';
}
let introPlaying = false, introTimer;
let introFinish = null;
// Kết thúc màn chào đón (chạy hết, hoặc bấm OK/Back để bỏ qua)
function finishIntro() {
  const f = introFinish; introFinish = null;
  clearTimeout(introTimer);
  if (!f) return;
  const v = $('introVid');
  const tx = $('introText');
  if (INTRO_ONLY) { v.pause(); tx.classList.add('fade'); f(); return; }   // giữ khung hình cuối, mờ dần vào launcher
  v.classList.add('fade'); tx.classList.add('fade');
  setTimeout(() => { v.pause(); v.classList.add('hide'); v.classList.remove('fade', 'kb'); tx.classList.add('hide'); tx.classList.remove('fade', 'go'); }, 600);
  f();
}
function playIntro() {
  introPlaying = true;
  const wasPlaying = ytReady && loadedId && player.getPlayerState() === YT.PlayerState.PLAYING;
  if (wasPlaying) player.pauseVideo();
  $('idle').classList.remove('hide'); $('corner').classList.add('hide'); $('qrFloat').classList.add('hide'); $('ticker').classList.add('hide');
  clearTimeout(introTimer);
  introFinish = INTRO_ONLY ? toLauncher : () => { introPlaying = false; started = true; sync(); if (wasPlaying) player.playVideo(); };
  if ((state && state.introStyle) !== 'effects') videoIntro(); else effectsIntro();
}
// Kiểu 1: video chào đón (mặc định)
// Chữ trên video: 3 dòng gõ trong Cài đặt trên điện thoại, font và màu đặt sẵn
function showIntroText() {
  const st = state || {}, tx = $('introText');
  const lines = [st.brand1 || '', st.brand2 || '', st.brand3 || ''];
  if (!st.overlayText || !lines.some(Boolean)) { tx.classList.add('hide'); return false; }
  const size = (t, max, k) => Math.min(max, k / Math.max([...t].length, 1)) + 'vw';
  // Dòng 1-2: chữ vàng kim, chữ cuối màu xanh ngọc (giống video mẫu)
  const goldTeal = t => {
    const w = t.trim().split(/\s+/);
    if (w.length < 2) return `<span class="g">${esc(t)}</span>`;
    const last = w.pop();
    return `<span class="g">${esc(w.join(' '))} </span><span class="t">${esc(last)}</span>`;
  };
  $('it1').innerHTML = goldTeal(lines[0]); $('it1').style.fontSize = size(lines[0], 7.2, 105); $('it1').style.display = lines[0] ? '' : 'none';
  $('it2').innerHTML = goldTeal(lines[1]); $('it2').style.fontSize = size(lines[1], 5.4, 95);  $('it2').style.display = lines[1] ? '' : 'none';
  $('it3').innerHTML = `<span class="g">${esc(lines[2])}</span>`;
  $('it3wrap').style.fontSize = size(lines[2], 6, 130); $('it3wrap').style.display = lines[2] ? '' : 'none';
  $('ribbons').style.top = '-0.15em'; $('ribbons').style.height = '2.2em';
  // Nốt nhạc và lấp lánh rải quanh chữ
  const notes = ['♪', '♫', '♬', '♩'];
  let fx = '';
  for (let i = 0; i < 12; i++) {
    const left = i % 2 ? 62 + Math.random() * 22 : 14 + Math.random() * 22, top = 22 + Math.random() * 56;
    fx += `<span class="nt" style="left:${left}vw;top:${top}vh;font-size:${(1.6 + Math.random() * 1.8).toFixed(1)}vw;animation-delay:${(1 + Math.random() * 2.5).toFixed(2)}s,${(Math.random() * 2).toFixed(2)}s">${notes[i % 4]}</span>`;
  }
  for (let i = 0; i < 26; i++) {
    fx += `<span class="sp" style="left:${(8 + Math.random() * 84).toFixed(1)}vw;top:${(15 + Math.random() * 70).toFixed(1)}vh;animation-delay:${(Math.random() * 3).toFixed(2)}s;animation-duration:${(1.2 + Math.random() * 1.5).toFixed(2)}s"></span>`;
  }
  $('itFx').innerHTML = fx;
  tx.classList.remove('hide', 'fade', 'go'); void tx.offsetWidth; tx.classList.add('go');
  return true;
}
function videoIntro() {
  const v = $('introVid');
  let fell = false;
  const fallback = () => { if (fell) return; fell = true; v.classList.add('hide'); $('introText').classList.add('hide'); effectsIntro(); };
  const src = '/intro.mp4?v=' + ((state && state.introVer) || 1);
  if (!v.src.endsWith(src)) { v.src = src; v.load(); }
  const withText = showIntroText();
  v.classList.toggle('kb', withText);   // có chữ: video nền zoom chậm cho sinh động
  v.classList.remove('hide', 'fade');
  v.muted = false;
  try { v.currentTime = 0; } catch (_) { }
  v.onended = finishIntro;
  v.onerror = fallback;
  const p = v.play();
  if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(fallback); });   // TV chặn tiếng: phát không tiếng
  introTimer = setTimeout(finishIntro, 15000);   // an toàn: video kẹt thì vẫn tiếp tục
}
// Kiểu 2: hiệu ứng có tên tự đặt
function effectsIntro() {
  clearTimeout(introTimer);
  $('idle').classList.remove('enter'); void $('idle').offsetWidth; $('idle').classList.add('enter');
  jingle();
  introTimer = setTimeout(finishIntro, INTRO_ONLY ? 4300 : 4500);
}
function begin() {
  if (started || introPlaying) return;
  $('start').classList.add('hide');
  playIntro();
}
$('startBtn').onclick = begin;
// Trong app Milano Launcher thì TV đã cho phép tự phát có tiếng: bỏ qua màn "Bấm OK".
// Chờ lấy tên đã lưu từ máy chủ (tối đa 1,5 giây) rồi mới chạy màn chào đón.
let gotState = false;
if (/MilanoLauncher/.test(navigator.userAgent)) {
  const wait = Date.now();
  (function go() { if (gotState || Date.now() - wait > 1500) begin(); else setTimeout(go, 50); })();
}
// Nút Back của Milano Launcher: đóng bảng tìm trên TV trước, không có gì để đóng thì về launcher
window.milanoBack = () => {
  if (introPlaying || INTRO_ONLY) { finishIntro(); return true; }   // bấm Back: bỏ qua chào đón
  if (!$('tvs').classList.contains('hide')) { closeTvSearch(); return true; }
  return false;
};

// ---------- YouTube IFrame API ----------
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    host: 'https://www.youtube-nocookie.com',   // giống Milano Tube
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1, cc_load_policy: 0, cc_lang_pref: 'vi' },
    events: {
      onReady: () => { ytReady = true; sync(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED && state?.current) send({ type: 'ended', id: state.current.id });
        if (e.data === YT.PlayerState.PLAYING) { send({ type: 'status', paused: false }); noCaptions(); }
        if (e.data === YT.PlayerState.PAUSED) send({ type: 'status', paused: true });
      },
      onError: e => { if (state?.current) send({ type: 'error', id: state.current.id, code: e.data }); }
    }
  });
};

// Tắt phụ đề tự động của YouTube (bài karaoke đã có lời trên video)
function noCaptions() {
  try {
    player.setOption('captions', 'track', {});
    player.unloadModule('captions');
    player.unloadModule('cc');
  } catch (_) { }
}

function sync() {
  if (!state) return;
  const c = state.current;
  if (introPlaying) return;
  $('idle').classList.toggle('hide', !!c);
  $('corner').classList.toggle('hide', !c);
  $('ticker').classList.toggle('hide', !c);
  $('qrFloat').classList.toggle('hide', !c);
  renderNext();
  if (!ytReady || !started) return;
  player.setVolume(state.volume);
  if (!c) { if (loadedId) { player.stopVideo(); loadedId = null; } return; }
  if (loadedId === c.id && tickKey !== c.id + '|' + c.singer) setTicker(c);   // đổi người hát khi hát lại
  if (loadedId !== c.id) {
    loadedId = c.id;
    player.loadVideoById(c.videoId);
    showBanner(c);
  }
}

function renderNext() {
  const q = state.queue.slice(0, 3);
  $('nextBox').innerHTML = q.length
    ? '<b>Bài tiếp theo</b>' + q.map((x, i) => `<div class="row">${i + 1}. ${esc(x.title)}${x.singer ? ' — 🎤 ' + esc(x.singer) : ''}</div>`).join('')
    : '<b>Hàng chờ trống</b><div class="row">Quét mã để thêm bài</div>';
}

let bt;
let tickKey = '';
function setTicker(c) {
  tickKey = c.id + '|' + c.singer;
  const who = c.singer ? `🎤 <b>${esc(c.singer)}</b> đang hát: ` : '🎤 Đang hát: ';
  const one = `<span>${who}${esc(c.title)}</span>`;
  $('tickRun').innerHTML = one + one;           // lặp 2 lần để chạy liên tục không đứt
  const len = (c.singer || '').length + c.title.length;
  $('tickRun').style.animationDuration = Math.max(12, len * 0.35) + 's';
}
function showBanner(c) {
  setTicker(c);
  $('bTitle').textContent = c.title;
  $('bSinger').textContent = c.singer ? '🎤 ' + c.singer : '';
  $('banner').classList.remove('out');
  $('corner').style.opacity = 1;
  clearTimeout(bt);
  bt = setTimeout(() => { $('banner').classList.add('out'); $('corner').style.opacity = .55; }, 9000);
}

let tt;
function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 3500); }

// ---------- Đồng bộ với máy chủ trong app (long-poll) ----------
const send = m => fetch('/api/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(m) }).catch(() => {});
const sleep = ms => new Promise(r => setTimeout(r, ms));
let since = -1;
(async function poll() {
  while (true) {
    try {
      const r = await fetch('/api/poll?role=tv&since=' + since, { cache: 'no-store' });
      const j = await r.json();
      since = j.seq; state = j.state; gotState = true;
      setBrand(state.brand1 ?? 'MILANO', state.brand2 ?? 'KARAOKE');
      sync();
      (j.events || []).forEach(onEvent);
    } catch (_) { await sleep(2000); }
  }
})();
function onEvent(m) {
    if (m.type === 'toast') toast(m.msg);
    else if (m.type === 'cmd' && m.cmd === 'intro') { if (started || introPlaying) playIntro(); }   // không cần YouTube
    else if (m.type === 'cmd' && ytReady) {
      if (m.cmd === 'toggle') player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
      if (m.cmd === 'restart') { player.seekTo(0, true); player.playVideo(); }
      if (m.cmd === 'intro' && (started || introPlaying)) playIntro();   // đang chạy intro cũ thì chạy lại bản mới
      if (m.cmd === 'volume') { player.setVolume(m.value); toast('🔊 Âm lượng ' + m.value + '%'); }
    }
    else if (m.type === 'tvSearch') openTvSearch(m);
    else if (m.type === 'tvSearchClose') closeTvSearch();
}

// ---------- Tìm trên TV (điều khiển bằng remote TV) ----------
let tvRes = [], focusIdx = 0, tvsTimer;
function openTvSearch(m) {
  $('tvs').classList.remove('hide');
  $('tvsQ').textContent = m.q;
  if (m.loading) { $('tvsGrid').innerHTML = '<div style="font-size:1.6vw;color:#9aa3b8">Đang tìm…</div>'; return; }
  tvRes = (m.results || []).slice(0, 12);
  focusIdx = 0;
  $('tvsGrid').innerHTML = tvRes.length ? tvRes.map((x, i) => `
    <div class="res" data-i="${i}"><img src="${esc(x.thumb)}"><div class="t">${esc(x.title)}</div><div class="d">${esc(x.duration)} · ${esc(x.channel)}</div></div>`).join('')
    : '<div style="font-size:1.6vw;color:#9aa3b8">Không thấy bài nào</div>';
  paintFocus();
  armAutoClose();
}
function closeTvSearch() { $('tvs').classList.add('hide'); clearTimeout(tvsTimer); }
function armAutoClose() { clearTimeout(tvsTimer); tvsTimer = setTimeout(closeTvSearch, 60000); }
function paintFocus() {
  document.querySelectorAll('.res').forEach((el, i) => el.classList.toggle('focus', i === focusIdx));
}
$('tvsGrid').addEventListener('click', e => {
  const r = e.target.closest('.res'); if (!r) return;
  focusIdx = +r.dataset.i; addFocused();
});
function addFocused() {
  const x = tvRes[focusIdx]; if (!x) return;
  send({ type: 'add', item: x, singer: '' });
  document.querySelectorAll('.res')[focusIdx]?.classList.add('added');
}

document.addEventListener('keydown', e => {
  const k = e.key;
  if (introPlaying || INTRO_ONLY) { if (k === 'Enter' || k === ' ') { e.preventDefault(); finishIntro(); } return; }   // OK: bỏ qua chào đón
  if (!started) { if (k === 'Enter' || k === ' ') { e.preventDefault(); begin(); } return; }

  if (!$('tvs').classList.contains('hide')) {
    const cols = 4, n = tvRes.length;
    armAutoClose();
    if (k === 'ArrowRight') focusIdx = Math.min(n - 1, focusIdx + 1);
    else if (k === 'ArrowLeft') focusIdx = Math.max(0, focusIdx - 1);
    else if (k === 'ArrowDown') focusIdx = Math.min(n - 1, focusIdx + cols);
    else if (k === 'ArrowUp') focusIdx = Math.max(0, focusIdx - cols);
    else if (k === 'Enter') addFocused();
    else if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack') closeTvSearch();
    else return;
    e.preventDefault(); paintFocus(); return;
  }

  // Phím remote khi đang hát
  if (k === 'Enter' || k === 'MediaPlayPause' || k === ' ') { send({ type: 'toggle' }); e.preventDefault(); }
  else if (k === 'MediaTrackNext' || k === 'MediaFastForward') send({ type: 'skip' });
  else if (k === 'MediaRewind' || k === 'MediaTrackPrevious') send({ type: 'restart' });
  else if (k === 'ArrowUp') send({ type: 'volume', delta: 10 });
  else if (k === 'ArrowDown') send({ type: 'volume', delta: -10 });
});
</script>
</body>
</html>
